version: '3.8'

services:
  # التطبيق الرئيسي
  app:
    container_name: cortoba-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
      - PORT=80
      - HOST=0.0.0.0
    env_file:
      - .env.production
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./ssl:/app/ssl
    restart: always
    networks:
      - cortoba-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (اختياري)
  nginx:
    container_name: cortoba-nginx
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl:ro
    depends_on:
      - app
    restart: always
    networks:
      - cortoba-network

  # قاعدة البيانات PostgreSQL (اختياري)
  postgres:
    container_name: cortoba-db
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=cortoba
      - POSTGRES_USER=cortoba_user
      - POSTGRES_PASSWORD=secure_password_here
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    networks:
      - cortoba-network

  # Redis للتخزين المؤقت (اختياري)
  redis:
    container_name: cortoba-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - cortoba-network

networks:
  cortoba-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: